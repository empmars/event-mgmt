server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/events   { proxy_pass http://event-service:3001/events; }
  location /api/bookings { proxy_pass http://booking-service:3002/bookings; }

  # exposed so Prometheus (on the monitoring instance) can scrape app metrics
  location = /metrics/events   { proxy_pass http://event-service:3001/metrics; }
  location = /metrics/bookings { proxy_pass http://booking-service:3002/metrics; }
}
