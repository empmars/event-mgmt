global:
  scrape_interval: 15s
scrape_configs:
  - job_name: app-host
    static_configs: [{ targets: ['APP_EC2_PRIVATE_IP:9100'] }]
  - job_name: event-service
    metrics_path: /metrics/events
    static_configs: [{ targets: ['APP_EC2_PRIVATE_IP:30080'] }]
  - job_name: booking-service
    metrics_path: /metrics/bookings
    static_configs: [{ targets: ['APP_EC2_PRIVATE_IP:30080'] }]
