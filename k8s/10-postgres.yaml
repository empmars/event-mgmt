# TIER 3 - DATA
apiVersion: v1
kind: Secret
metadata: { name: postgres-secret, namespace: event-system }
type: Opaque
stringData:
  POSTGRES_USER: eventuser
  POSTGRES_PASSWORD: eventpass
  POSTGRES_DB: eventsdb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-pvc, namespace: event-system }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: event-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-secret } }]
          env: [{ name: PGDATA, value: /var/lib/postgresql/data/pgdata }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "eventuser"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 384Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: event-system }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
