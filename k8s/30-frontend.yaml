# TIER 1 - PRESENTATION (public entry point on NodePort 30080)
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: event-system }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: DOCKER_USER/frontend:TAG
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 96Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: event-system }
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
