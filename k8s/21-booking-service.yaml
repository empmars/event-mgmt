# TIER 2 - LOGIC (booking-service)
apiVersion: apps/v1
kind: Deployment
metadata: { name: booking-service, namespace: event-system }
spec:
  replicas: 2
  selector: { matchLabels: { app: booking-service } }
  template:
    metadata: { labels: { app: booking-service } }
    spec:
      containers:
        - name: booking-service
          image: DOCKER_USER/booking-service:TAG
          ports: [{ containerPort: 3002 }]
          env:
            - { name: DB_HOST, value: postgres }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_DB } }
            - { name: EVENT_SERVICE_URL, value: "http://event-service:3001" }
          readinessProbe: { httpGet: { path: /health, port: 3002 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 3002 }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: booking-service, namespace: event-system }
spec:
  selector: { app: booking-service }
  ports: [{ port: 3002, targetPort: 3002 }]
